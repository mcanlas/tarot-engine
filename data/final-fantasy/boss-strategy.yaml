rules:
  - boss: garland
    section: opening
    when: always
    advice: "Have {{members:all}} focus on {{boss}}; there are no extra enemies to manage"

  - boss: garland
    section: party-edge
    when: { capability: physical-damage, atLeast: 3 }
    advice: "Have {{members:capability:physical-damage}} lean into basic attacks; setup costs more turns than it saves"

  - boss: garland
    section: party-edge
    when: { spellAttribute: elemental }
    advice: "Have {{members:knows-attribute:elemental}} spend MP on a learned elemental spell instead of making a weak physical attack"

  - boss: garland
    section: safety
    when: { spellAttribute: hp-recovery }
    advice: "Keep {{members:capability:hp-recovery}} attacking until someone is near half health, then use a learned HP-recovery spell"

  - boss: garland
    section: safety
    when:
      all:
        - not: { capability: hp-recovery }
        - item: potion
    advice: "With no recovery spell, {{members:can-use:potion}} can use Potions from shared inventory"

  - boss: garland
    section: safety
    when:
      all:
        - not: { capability: hp-recovery }
        - not: { item: potion }
    advice: "You have no in-party healing, so arrive rested and treat this as a damage race"

  - boss: pirates
    section: opening
    when: always
    advice: "Have {{members:all}} remove one Pirate at a time so the enemy side gets fewer attacks each round"

  - boss: pirates
    section: party-edge
    when: { spell: sleep }
    advice: "Have {{members:first-knows:sleep}} cast Sleep to control the full crowd, then clean up awake targets first"

  - boss: pirates
    section: party-edge
    when: { spellAttribute: elemental }
    advice: "Have {{members:knows-attribute:elemental}} conserve learned elemental magic unless basic attacks fall behind"

  - boss: pirates
    section: party-edge
    when: { capability: physical-damage, atLeast: 2 }
    advice: "Have {{members:capability:physical-damage}} use basic attacks and conserve MP"

  - boss: pirates
    section: safety
    when: { capability: hp-recovery }
    advice: "Do not heal preemptively; have {{members:capability:hp-recovery}} recover HP only if focused damage puts someone at risk"

  - boss: pirates
    section: safety
    when: { not: { capability: hp-recovery } }
    advice: "Without healing, crowd control and quickly reducing the Pirate count are your defenses"

  - boss: piscodemons
    section: opening
    when: always
    advice: "Have {{members:all}} focus on one Piscodemon at a time; every defeat immediately reduces incoming physical attacks"

  - boss: piscodemons
    section: party-edge
    when:
      all:
        - spell: thunder
        - not: { capability: physical-damage }
    advice: "With no physical attacker, have {{members:knows:thunder}} cast Thunder; avoid the Piscodemons' resistance to Fire and Blizzard"

  - boss: astos
    section: opening
    when: always
    advice: "{{boss}} opens with lethal magic, so disruption or a fast knockout matters more than attrition"

  - boss: astos
    section: party-edge
    when: { spell: silence }
    advice: "Have {{members:first-knows:silence}} cast Silence immediately; if it lands, Astos loses Death and the rest of his spell list"

  - boss: astos
    section: party-edge
    when:
      all:
        - spell: temper
        - capability: physical-damage
    advice: "Have {{members:first-knows:temper}} cast Temper on {{members:preferred-physical-attacker}} to end the fight before Astos gets more spell turns"

  - boss: astos
    section: party-edge
    when:
      all:
        - spell: haste
        - capability: physical-damage
    advice: "Have {{members:first-knows:haste}} cast Haste on {{members:preferred-physical-attacker}} for the quickest knockout line"

  - boss: astos
    section: safety
    when:
      all:
        - spell: slow
        - not: { spell: silence }
    advice: "Without Silence, have {{members:first-knows:slow}} try Slow to blunt Astos's physical attacks; it will not prevent Death"

  - boss: vampire
    section: opening
    when: always
    advice: "{{boss}} is a short burst fight: exploit its weaknesses before paralysis creates bad turns"

  - boss: lich
    section: opening
    when: always
    advice: "{{boss}} is the first sustained boss fight here; keep everyone healthy enough to survive its spell sequence"

  - bossTag: undead
    section: party-edge
    when: { spellTargetFamily: undead }
    advice: "{{boss}} is undead; have {{members:knows-target-family:undead}} use their strongest learned anti-undead spell"

  - bossTag: undead
    section: party-edge
    when: { spellElement: fire }
    advice: "{{boss}} is undead and weak to fire; have {{members:knows-element:fire}} use their strongest learned fire spell"

  - boss: lich
    section: safety
    when: { spell: protect }
    advice: "Have {{members:knows:protect}} cast Protect to raise an ally's defense before settling into recovery duty"

  - boss: lich
    section: safety
    when: { spell: blink }
    advice: "Have {{members:knows:blink}} cast Blink for personal evasion, but do not treat it as protection from Lich's spells"

  - boss: lich
    section: safety
    when: { capability: hp-recovery }
    advice: "Have {{members:capability:hp-recovery}} reserve enough HP recovery for after Lich's party-wide magic"

  - boss: lich
    section: safety
    when: { not: { capability: hp-recovery } }
    advice: "With no healer, Lich becomes a strict damage race; arrive fully stocked and commit your strongest attacks"

  - boss: marilith
    section: opening
    when: always
    advice: "Marilith applies sustained physical pressure; establish your defenses before committing everyone to offense"

  - boss: evil-eye
    section: opening
    when: always
    advice: "Evil Eye is dangerous because of its disabling magic, so treat the encounter as an immediate damage race"

  - boss: dragon-zombies
    section: opening
    when: always
    advice: "Focus both Dragon Zombies on one target at a time so the second half of the fight has fewer incoming attacks"

  - boss: kraken
    section: opening
    when: always
    advice: "Kraken's physical offense is the immediate threat; stabilize the front line and concentrate damage"

  - boss: blue-dragon
    section: opening
    when: always
    advice: "Blue Dragon is a compact burst fight; use reliable single-target damage and preserve enough recovery for the climb ahead"

  - boss: warmech
    section: opening
    when: always
    advice: "Warmech can overwhelm the whole party quickly; open with your strongest defense, recovery, and focused damage"

  - boss: tiamat
    section: opening
    when: always
    advice: "Tiamat resists broad elemental offense, so build the plan around physical damage and sustained recovery"

  - boss: lich-rematch
    section: opening
    when: always
    advice: "The Lich rematch punishes a depleted party; restore the group quickly and save decisive damage for safe turns"

  - boss: marilith-rematch
    section: opening
    when: always
    advice: "The Marilith rematch adds late-game lethality to its physical pressure; protect the front line and end it cleanly"

  - boss: kraken-rematch
    section: opening
    when: always
    advice: "The Kraken rematch is an endurance check; keep recovery ahead of its physical pressure while focusing damage"

  - boss: tiamat-rematch
    section: opening
    when: always
    advice: "The Tiamat rematch is the last resource check before Chaos; lean on reliable damage and avoid wasteful casting"

  - boss: chaos
    section: opening
    when: always
    advice: "Chaos is a sustained final fight; establish offense and defense early, then keep healing ahead of incoming damage"

  - boss: marilith
    section: party-edge
    when: { spell: sleep }
    advice: "Have {{members:first-knows:sleep}} try Sleep; unlike most bosses, Marilith can lose turns to it"

  - boss: evil-eye
    section: party-edge
    when: { capability: physical-damage }
    advice: "Have {{members:preferred-physical-attacker}} attack immediately rather than spend a turn setting up against Evil Eye"

  - boss: evil-eye
    section: party-edge
    when:
      all:
        - not: { capability: physical-damage }
        - capability: offensive-magic
    advice: "With no physical attacker, have {{members:capability:offensive-magic}} spend learned attack magic immediately before Evil Eye can disable the party"

  - boss: kraken
    section: party-edge
    when: { spellElement: lightning }
    advice: "Have {{members:knows-element:lightning}} exploit Kraken's weakness with their strongest learned lightning spell"

  - boss: blue-dragon
    section: party-edge
    when: { spellElement: fire }
    advice: "Have {{members:knows-element:fire}} exploit Blue Dragon's weakness with their strongest learned fire spell"

  - boss: tiamat
    section: party-edge
    when: { spellAttribute: elemental }
    advice: "Have {{members:knows-attribute:elemental}} conserve elemental MP against Tiamat's resistances and support the physical plan instead"

  - boss: lich-rematch
    section: party-edge
    when: { spellElement: fire }
    advice: "Have {{members:knows-element:fire}} conserve fire magic; the rematch no longer has Lich's original fire weakness"

  - boss: marilith-rematch
    section: party-edge
    when: { spellAttribute: elemental }
    advice: "Have {{members:knows-attribute:elemental}} save elemental MP; the rematch resists Fire, Blizzard, and Thunder"

  - boss: kraken-rematch
    section: party-edge
    when: { spellElement: lightning }
    advice: "Have {{members:knows-element:lightning}} conserve lightning magic; Kraken's lightning weakness is gone in the rematch"

  - bossTrait: physical-buffs-effective
    section: party-edge
    when:
      all:
        - spell: haste
        - capability: physical-damage
    advice: "Have {{members:first-knows:haste}} cast Haste on {{members:preferred-physical-attacker}} for the main damage line against {{boss}}"

  - bossTrait: physical-buffs-effective
    section: party-edge
    when:
      all:
        - spell: temper
        - capability: physical-damage
    advice: "Have {{members:first-knows:temper}} cast Temper on {{members:preferred-physical-attacker}} once Haste or the opening defense is covered"

  - bossTrait: repeated-physical-damage
    section: safety
    when:
      all:
        - spell: protect
        - front: primary
    advice: "Have {{members:knows:protect}} use Protect to blunt repeated physical hits from {{boss}}"

  - bossTrait: repeated-physical-damage
    section: safety
    when:
      all:
        - spell: protect
        - not: { front: primary }
    advice: "Have {{members:first-knows:protect}} cast Protect on {{members:front}}; fixed slot 1 needs the party's first defensive investment against {{boss}}"

  - bossTrait: repeated-physical-damage
    section: safety
    when:
      all:
        - front: fragile
        - frontSpell: blink
    advice: "Have {{members:front}} cast Blink early; personal evasion helps the exposed caster survive {{boss}}'s repeated physical turns"

  - bossTrait: repeated-physical-damage
    section: safety
    when:
      all:
        - front: primary
        - not: { spell: protect }
    advice: "{{members:front}} already fits the front line without support magic; treat further defensive investment there as optional and shorten {{boss}}'s physical exchange with focused damage instead"

  - bossTrait: repeated-physical-damage
    section: safety
    when:
      all:
        - not: { front: primary }
        - not: { spell: protect }
        - not: { frontSpell: blink }
    advice: "Treat {{members:front}} as the survival bottleneck: commit the best available armor and recovery there, then shorten the physical exchange with focused damage"

  - bossTrait: endurance
    section: safety
    when: { capability: hp-recovery }
    advice: "Have {{members:capability:hp-recovery}} preserve HP-recovery turns and MP; this fight is too long to treat as a pure damage race"

  - bossTrait: endurance
    section: safety
    when: { not: { capability: hp-recovery } }
    advice: "With no recovery magic, have {{members:all}} commit to a short buff-and-burst line; {{boss}} will win a long fight"

  - bossTrait: lightning-damage
    section: safety
    when: { spell: nulshock }
    advice: "Have {{members:first-knows:nulshock}} cast NulShock before the party is exposed to repeated lightning damage from {{boss}}"

  - bossTrait: fire-damage
    section: safety
    when: { spell: nulblaze }
    advice: "Have {{members:first-knows:nulblaze}} cast NulBlaze early to halve the party's fire damage"

  - bossTrait: ice-damage
    section: safety
    when: { spell: nulfrost }
    advice: "Have {{members:first-knows:nulfrost}} cast NulFrost before committing to offense so party-wide ice damage is easier to heal through"

  - bossTrait: instant-death
    section: safety
    when: { spell: nuldeath }
    advice: "Have {{members:first-knows:nuldeath}} cast NulDeath before {{boss}} gets repeated chances to remove a party member instantly"

  - bossTrait: instant-death
    section: safety
    when: { spell: life }
    advice: "Keep {{members:knows:life}} alive and reserve a Life charge to recover from an instant knockout"

  - bossTrait: repeated-physical-damage
    section: safety
    when: { spell: protera }
    advice: "Have {{members:first-knows:protera}} cast Protera so the whole party can withstand {{boss}}'s repeated physical hits"

  - bossTrait: repeated-physical-damage
    section: safety
    when: { spell: invisira }
    advice: "Have {{members:first-knows:invisira}} cast Invisira to raise the whole party's evasion before the long physical exchange"

  - bossTrait: broad-elemental-resistance
    section: party-edge
    when: { spell: flare }
    advice: "Have {{members:knows:flare}} use Flare as reliable non-elemental offense against {{boss}}"

  - bossTrait: broad-elemental-resistance
    section: party-edge
    when: { spell: saber }
    advice: "Have {{members:knows:saber}} cast Saber on themselves when their best contribution is a self-buffed physical attack"

  - bossTrait: grouped-enemies
    section: safety
    when: always
    advice: "{{boss}} fields multiple enemies that each act every round; have {{members:all}} finish one off before spreading damage to the rest"

  - bossTrait: burst-fight
    section: safety
    when: { capability: hp-recovery }
    advice: "Have {{members:capability:hp-recovery}} save HP recovery for after the fight; {{boss}} will not last long enough to need a mid-fight heal"

  - bossTrait: burst-fight
    section: safety
    when: { not: { capability: hp-recovery } }
    advice: "With no healer, commit fully to offense against {{boss}}; the fight is short enough that raw damage matters more than a survival margin"

  - bossTrait: inflicts-paralysis
    section: safety
    when: { spell: life }
    advice: "Keep {{members:knows:life}} alive and ready to revive whichever member {{boss}} paralyzes out of the fight"

  - bossTrait: inflicts-paralysis
    section: safety
    when: { not: { spell: life } }
    advice: "Without a revival spell, avoid concentrating your whole offense behind one attacker {{boss}} could paralyze"
