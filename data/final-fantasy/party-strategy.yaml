rules:
  # Roster structure
  - id: solo-focus
    kind: strength
    when:
      not:
        sizeAtLeast: 2
    statement: A solo party concentrates its equipment, consumables, and tactical plan on one character

  - id: full-roster
    kind: strength
    when:
      sizeAtLeast: 4
    statement: Four members provide the most actions and the most room for complementary roles

  - id: solo-fragility
    kind: weakness
    when:
      not:
        sizeAtLeast: 2
    statement: A solo party has no backup action when its only member is disabled or defeated

  # Fixed formation
  - id: primary-frontline
    kind: strength
    when:
      front: primary
    statement: Slot 1 puts the party's primary front-line specialist where concentrated enemy attacks are easiest to absorb

  - id: primary-frontliner-behind
    kind: weakness
    when:
      all:
        - not:
            front: primary
        - behindFront: primary
    statement: Fixed order leaves the primary front-line specialist behind another member, so that durability cannot absorb slot 1's concentrated pressure

  - id: fragile-front
    kind: weakness
    when:
      all:
        - sizeAtLeast: 2
        - front: fragile
    statement: A fragile caster in slot 1 needs the party's strongest defensive equipment, mitigation, and recovery support to remain functional

  - id: fragile-front-support
    kind: strength
    when:
      all:
        - sizeAtLeast: 2
        - front: fragile
        - capability: defensive-magic
        - capability: healing
    statement: Defensive and recovery magic give the party tools to compensate for a fragile caster's unavoidable slot 1 exposure

  # Capability counts and interactions
  - id: physical-core
    kind: strength
    when:
      capability: physical-damage
      atLeast: 2
    statement: Multiple physical attackers provide dependable damage without consuming spell resources

  - id: recovery
    kind: strength
    when:
      capability: healing
    statement: Access to healing makes the party resilient across long stretches of exploration

  - id: recovery-redundancy
    kind: strength
    when:
      capability: healing
      atLeast: 2
    statement: Multiple potential healers provide recovery redundancy and flexible turn allocation

  - id: magical-offense
    kind: strength
    when:
      capability: offensive-magic
    statement: Offensive magic gives the party an alternative to conventional weapon damage

  - id: magical-depth
    kind: strength
    when:
      capability: offensive-magic
      atLeast: 2
    statement: Multiple offensive casters provide deeper magical reserves across repeated encounters

  - id: mixed-offense
    kind: strength
    when:
      all:
        - capability: physical-damage
        - capability: offensive-magic
    statement: Physical and magical offense give the party answers to different enemy defenses

  - id: defensive-support
    kind: strength
    when:
      capability: defensive-magic
    statement: Defensive magic can reduce physical or elemental pressure instead of relying only on recovery after damage lands

  - id: physical-amplification
    kind: strength
    when:
      all:
        - capability: physical-damage
          atLeast: 2
        - capability: physical-support
    statement: Temper or Haste can convert support turns into stronger sustained output from the party's physical core

  - id: battlefield-control
    kind: strength
    when:
      capability: control-magic
    statement: Sleep, Silence, or Slow can suppress dangerous enemy actions when direct damage is not the safest answer

  - id: anti-undead-specialist
    kind: strength
    when:
      capability: anti-undead
    statement: Dia gives the party a resource-efficient magical attack against undead groups

  - id: no-physical-offense
    kind: weakness
    when:
      not:
        capability: physical-damage
    statement: Without a conventional physical attacker, routine damage leans heavily on spell resources

  - id: single-physical-attacker
    kind: weakness
    when:
      all:
        - sizeAtLeast: 2
        - capability: physical-damage
        - not:
            capability: physical-damage
            atLeast: 2
    statement: Physical pressure depends on one member remaining effective

  - id: no-recovery
    kind: weakness
    when:
      not:
        capability: healing
    statement: Without a conventional healer, attrition and recovery items are persistent concerns

  - id: single-healer
    kind: weakness
    when:
      all:
        - sizeAtLeast: 2
        - capability: healing
        - not:
            capability: healing
            atLeast: 2
    statement: Recovery depends on one member remaining able to act

  - id: unsupported-physical-core
    kind: weakness
    when:
      all:
        - sizeAtLeast: 2
        - capability: physical-damage
          atLeast: 2
        - not:
            capability: healing
    statement: A physical core without recovery support must end difficult stretches before attrition takes over

  - id: no-front-line-specialist
    kind: weakness
    when:
      all:
        - sizeAtLeast: 2
        - not:
            job: warrior
    statement: Without a primary front-line specialist, fixed slot 1 depends more heavily on equipment, mitigation, and recovery

  - id: no-magical-offense
    kind: weakness
    when:
      not:
        capability: offensive-magic
    statement: The party has few conventional answers when physical damage is ineffective

  - id: hybrid-action-bottleneck
    kind: weakness
    when:
      sameMemberCapabilities:
        - physical-damage
        - healing
        - offensive-magic
    statement: One generalist covers physical damage, recovery, and offensive magic, but those roles compete for the same turn and spell budget

  # Diversity and specialization tradeoffs
  - id: diverse-roster
    kind: strength
    when:
      distinctJobsAtLeast: 3
    statement: Three or more distinct classes broaden the party's equipment access and tactical options

  - id: diverse-investment
    kind: weakness
    when:
      distinctJobsAtLeast: 3
    statement: A broad roster spreads equipment and spell purchases across several competing priorities

  - id: repeated-specialty
    kind: strength
    when:
      repeatedJobAtLeast: 2
    statement: Repeated classes create a clear specialty and interchangeable members for that role

  - id: repeated-role-overlap
    kind: weakness
    when:
      repeatedJobAtLeast: 2
    statement: Repeated classes also duplicate blind spots and reduce the breadth gained from another role
